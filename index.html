<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7A1F1F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MebelMonitor" />
    <meta
      name="description"
      content="Aplikasi manajemen keuangan toko furnitur — kelola transaksi, HPP, biaya operasional, dan pantau omzet"
    />
    <title>Mebel Online Monitoring</title>
    <script>
      !function () {
        try {
          var t = localStorage.getItem("theme") || "system";
          if (t === "system") {
            if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
              document.documentElement.classList.add("dark");
            }
          } else if (t === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      }();
    </script>
    <!-- Lepas SW macet / reload beruntun tanpa butuh app bundle -->
    <script>
      !function () {
        try {
          var k = "__pwa_boot_n";
          var n = Number(sessionStorage.getItem(k) || "0") + 1;
          sessionStorage.setItem(k, String(n));
          setTimeout(function () {
            try {
              sessionStorage.setItem(k, "0");
            } catch (e) {}
          }, 6000);
          if (n < 3) return;
          sessionStorage.setItem(k, "0");
          var done = function () {
            location.reload();
          };
          var tasks = [];
          if ("serviceWorker" in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) {
                  return r.unregister();
                }));
              })
            );
          }
          if ("caches" in window) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) {
                  return caches.delete(key);
                }));
              })
            );
          }
          Promise.all(tasks).then(done).catch(done);
        } catch (e) {}
      }();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
